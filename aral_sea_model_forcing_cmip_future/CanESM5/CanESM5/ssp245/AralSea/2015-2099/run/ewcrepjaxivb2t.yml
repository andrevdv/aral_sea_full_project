documentation:
  title: Generic lumped forcing recipe
  description: Generic lumped forcing recipe
  authors:
  - unmaintained
  projects:
  - ewatercycle
datasets:
- dataset: CanESM5
  project: CMIP6
  ensemble: r1i1p1f1
  exp: ssp245
  mip: day
  grid: '*'
  activity: ScenarioMIP
preprocessors:
  spatial:
    extract_shape:
      shapefile: /home/avandervee3/aral_sea_full_project/data/shapefiles/AralSea/AralSea.shp
      crop: true
      decomposed: false
    area_statistics:
      operator: mean
  pr:
    extract_shape:
      shapefile: /home/avandervee3/aral_sea_full_project/data/shapefiles/AralSea/AralSea.shp
      crop: true
      decomposed: false
    area_statistics:
      operator: mean
  tas:
    extract_shape:
      shapefile: /home/avandervee3/aral_sea_full_project/data/shapefiles/AralSea/AralSea.shp
      crop: true
      decomposed: false
    area_statistics:
      operator: mean
  rsds:
    extract_shape:
      shapefile: /home/avandervee3/aral_sea_full_project/data/shapefiles/AralSea/AralSea.shp
      crop: true
      decomposed: false
    area_statistics:
      operator: mean
diagnostics:
  diagnostic:
    scripts:
      script:
        script: 
          /opt/conda/envs/ewatercycle2/lib/python3.12/site-packages/ewatercycle/esmvaltool/diagnostic/copier.py
    variables:
      pr:
        start_year: 2015
        end_year: 2099
        mip: day
        preprocessor: pr
      tas:
        start_year: 2015
        end_year: 2099
        mip: day
        preprocessor: tas
      rsds:
        start_year: 2015
        end_year: 2099
        mip: day
        preprocessor: rsds
